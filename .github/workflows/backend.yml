name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.14"

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: memovi
          POSTGRES_USER: memovi_app
          POSTGRES_PASSWORD: memovi_local_pg_9f4c8e2d7a6b41c3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U memovi_app -d memovi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-packages installs workspace members (and their deps such as
        # opentelemetry-api). Root is a virtual project with only tool groups.
        run: uv sync --all-packages --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: MyPy
        run: uv run python scripts/ci_mypy.py

      - name: Pytest
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: memovi
          POSTGRES_USER: memovi_app
          POSTGRES_PASSWORD: memovi_local_pg_9f4c8e2d7a6b41c3
        run: uv run coverage run -m pytest

      - name: Coverage
        run: uv run coverage report
