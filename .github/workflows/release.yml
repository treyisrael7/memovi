name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"

# Package jobs only read the tagged commit. Write is limited to the publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag vs application version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Require tag v<tauri.conf.json version>
        id: check
        run: python3 scripts/desktop_release.py validate --tag "${GITHUB_REF_NAME}"

  package-linux:
    name: Release package (Linux .deb)
    runs-on: ubuntu-latest
    needs: validate-tag
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Linux package
        working-directory: apps/desktop
        run: pnpm tauri build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target

      - name: Stage versioned .deb
        run: |
          python3 scripts/desktop_release.py stage \
            --platform linux \
            --arch "${{ runner.arch }}" \
            --version "${{ needs.validate-tag.outputs.version }}"

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v4
        with:
          name: memovi-release-linux
          path: release-assets/*.deb
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Release package (Windows NSIS + MSI)
    runs-on: windows-latest
    needs: validate-tag
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Require Windows signing secrets
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/desktop_release.py require-env WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Authenticode certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release_windows_certificate.ps1

      - name: Build signed Windows packages
        working-directory: apps/desktop
        shell: pwsh
        run: pnpm tauri build --config $env:WINDOWS_TAURI_SIGN_CONFIG
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target

      - name: Verify Authenticode signatures
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release_windows_verify.ps1

      - name: Stage versioned NSIS and MSI
        run: |
          python scripts/desktop_release.py stage --platform windows --arch "${{ runner.arch }}" --version "${{ needs.validate-tag.outputs.version }}"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: memovi-release-windows
          path: |
            release-assets/*.exe
            release-assets/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "memovi-windows-signing"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$($env:WINDOWS_CERT_THUMBPRINT)" -ErrorAction SilentlyContinue
          }

  package-macos:
    name: Release package (macOS .dmg)
    runs-on: macos-latest
    needs: validate-tag
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Require macOS signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          python3 scripts/desktop_release.py require-env \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_P8

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate into ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/release_macos_keychain.sh

      - name: Build signed and notarized macOS package
        working-directory: apps/desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm tauri build

      - name: Verify macOS signature and staple
        run: bash scripts/release_macos_verify.sh

      - name: Stage versioned .dmg
        run: |
          python3 scripts/desktop_release.py stage \
            --platform macos \
            --arch "${{ runner.arch }}" \
            --version "${{ needs.validate-tag.outputs.version }}"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: memovi-release-macos
          path: release-assets/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${MACOS_KEYCHAIN_PATH}" || true
          fi
          rm -rf "${RUNNER_TEMP}/memovi-macos-signing"

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - package-linux
      - package-windows
      - package-macos
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Download staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: memovi-release-*
          merge-multiple: true
          path: release-assets

      - name: Verify assets, checksums, and notes
        run: |
          python3 scripts/desktop_release.py prepare \
            --assets-dir release-assets \
            --notes-file release-notes.md \
            --tag "${{ needs.validate-tag.outputs.tag }}" \
            --version "${{ needs.validate-tag.outputs.version }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          APP_VERSION: ${{ needs.validate-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --title "Memovi ${APP_VERSION}" \
            --notes-file release-notes.md \
            "${extra[@]}" \
            release-assets/*
