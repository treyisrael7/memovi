[project]
name = "memovi-auth"
version = "0.1.0"
description = "Authentication and authorization domain boundary for the Memovi platform."
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi",
    "fastapi",
    "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/auth",
]

[tool.uv]
package = true
