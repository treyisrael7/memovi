[project]
name = "memovi-config"
version = "0.1.0"
description = "Typed application configuration, environment parsing, and startup validation for Memovi."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/memovi_config",
]

[tool.uv]
package = true
