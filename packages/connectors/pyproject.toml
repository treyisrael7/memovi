[project]
name = "memovi-connectors"
version = "0.1.0"
description = "Connector Framework for Memovi. Owns connector contracts, registry, configuration, authentication references, synchronization, normalization into Documents, health, scheduler foundation, and the production Filesystem Connector."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "memovi-shared",
    "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/memovi_connectors",
]

[tool.uv]
package = true

[tool.uv.sources]
memovi-shared = { workspace = true }
